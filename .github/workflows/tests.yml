# Runs the automated tests (tests/run.php) on every push and pull request.
# The result shows on GitHub: a green tick or a red cross next to each commit and PR (Actions tab for details).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']   # 8.3 is what the online host runs
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Run the tests
        run: php tests/run.php
